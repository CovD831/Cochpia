<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <title>Cochpia Palette Studio</title>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    :root { --bg:#dce9e6; --bg-deep:#a8cbca; --ink:#173238; --muted:#668084; --line:rgba(255,255,255,.7); --glass:rgba(247,255,252,.68); --glass-strong:rgba(252,255,253,.88); --accent:#137d9f; --danger:#b65757; --shadow:0 22px 60px rgba(42,91,98,.18); --r-lg:24px; --r-md:15px; --r-sm:10px; }
    * { box-sizing:border-box; } body { margin:0; min-width:320px; color:var(--ink); font:14px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; background:radial-gradient(circle at 76% 4%,#fff9ee 0 10%,transparent 28%),linear-gradient(135deg,var(--bg),var(--bg-deep)); position:relative; overflow-x:hidden; }
    body::before { content:""; position:fixed; z-index:-1; inset:-18%; pointer-events:none; background:radial-gradient(ellipse at 25% 25%,rgba(232,255,240,.45),transparent 27%),radial-gradient(ellipse at 72% 15%,rgba(106,210,206,.34),transparent 25%),radial-gradient(ellipse at 68% 78%,rgba(226,180,235,.24),transparent 24%),linear-gradient(115deg,rgba(184,238,216,.17),rgba(104,172,215,.14),rgba(244,201,210,.2)); filter:blur(35px) saturate(80%); animation:aurora-drift 24s ease-in-out infinite alternate; }
    @keyframes aurora-drift { from { transform:translate3d(-2%, -1%, 0) scale(1.02) rotate(-1deg); } to { transform:translate3d(3%, 2%, 0) scale(1.08) rotate(2deg); } }
    button,input,select,textarea { font:inherit; } button { cursor:pointer; } button:focus-visible,input:focus-visible,select:focus-visible { outline:3px solid rgba(19,125,159,.35); outline-offset:2px; }
    .app { min-height:100vh; padding:18px; display:grid; grid-template-columns:235px minmax(0,1fr); gap:16px; }
    .sidebar,.topbar,.panel,.swatch-editor,.preview { border:1px solid var(--line); background:var(--glass); box-shadow:var(--shadow),inset 0 1px rgba(255,255,255,.8); backdrop-filter:blur(24px) saturate(140%); -webkit-backdrop-filter:blur(24px) saturate(140%); }
    .sidebar { border-radius:var(--r-lg); padding:22px 14px; display:flex; flex-direction:column; gap:24px; }
    .brand { display:flex; align-items:center; gap:10px; padding:2px 8px 20px; border-bottom:1px solid rgba(79,125,127,.16); } .brand-mark { width:25px;height:25px;border-radius:50%;border:1px solid var(--accent);position:relative; } .brand-mark:after { content:"";position:absolute;left:5px;right:4px;top:11px;border-top:1px solid var(--accent);transform:rotate(-25deg); } .brand strong { font:600 17px Georgia,serif;letter-spacing:.08em; }
    .side-title { color:var(--muted); font-size:11px; letter-spacing:.12em; text-transform:uppercase; padding:0 9px; } .nav { display:grid; gap:4px; } .nav button { border:0; border-radius:12px; min-height:42px; padding:0 11px; display:flex; align-items:center; gap:10px; color:#527174; background:transparent; text-align:left; } .nav button:hover,.nav button.active { color:var(--ink); background:rgba(255,255,255,.55); } .nav button.active { box-shadow:inset 2px 0 var(--accent); } .nav svg { width:17px;height:17px; } .side-foot { margin-top:auto; color:var(--muted); font-size:12px; padding:14px 9px 0; border-top:1px solid rgba(79,125,127,.16); } .dot { display:inline-block;width:7px;height:7px;background:#3a9f7a;border-radius:50%;box-shadow:0 0 8px #3a9f7a;margin-right:7px; }
    main { min-width:0; } .topbar { height:68px; padding:0 17px; border-radius:20px; display:flex; align-items:center; justify-content:space-between; } .crumb { color:var(--muted); } .crumb b { color:var(--ink); font-weight:600; } .top-actions { display:flex; gap:8px; } .icon-btn { width:38px;height:38px;border:1px solid rgba(255,255,255,.78);border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.48);color:#456c70; } .icon-btn:hover { color:var(--accent); background:#fff; }
    .content { max-width:1300px; margin:auto; padding:35px 14px 40px; } .headline { display:flex; justify-content:space-between; align-items:end; gap:20px; margin-bottom:24px; } .eyebrow { color:var(--accent); font-size:11px; letter-spacing:.13em; text-transform:uppercase; } h1 { margin:7px 0 8px; font:500 clamp(31px,4vw,50px)/1.05 Georgia,"Songti SC",serif; letter-spacing:-.035em; } .headline p { max-width:560px; color:var(--muted); margin:0; } .mode { display:flex; align-items:center; gap:8px; color:var(--muted); font-size:12px; white-space:nowrap; }
    .toolbar { display:flex; flex-wrap:wrap; align-items:center; gap:9px; margin-bottom:18px; } .button { min-height:40px; border:1px solid rgba(255,255,255,.78); border-radius:12px; padding:0 14px; display:inline-flex; align-items:center; gap:8px; color:var(--ink); background:rgba(255,255,255,.56); box-shadow:0 4px 12px rgba(38,94,100,.08); } .button:hover { background:#fff; border-color:rgba(19,125,159,.35); } .button.primary { border-color:var(--accent); color:#fff; background:var(--accent); } .button.quiet { border-color:transparent; background:transparent; color:var(--accent); box-shadow:none; } .button.danger { color:var(--danger); } .toolbar-spacer { flex:1; }
    .workspace { display:grid; grid-template-columns:minmax(0,1.25fr) minmax(290px,.75fr); grid-template-areas:"palette preview" "palette export"; gap:16px; align-items:start; } .workspace > .panel { grid-area:palette; } .workspace > div { display:contents; } .preview { grid-area:preview; } .export { grid-area:export; } .panel { border-radius:var(--r-lg); padding:20px; } .panel-head { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:15px; } .panel-head h2 { margin:0; font-size:16px; font-weight:650; } .panel-head span { color:var(--muted); font-size:12px; }
    .swatches { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px; } .swatch-editor { min-width:0; overflow:hidden; border-radius:var(--r-md); background:var(--glass-strong); } .swatch-color { height:110px; position:relative; display:flex; align-items:flex-end; padding:10px; } .swatch-color button { margin-left:auto; width:28px;height:28px;border:1px solid rgba(255,255,255,.65);border-radius:50%;display:grid;place-items:center;color:inherit;background:rgba(255,255,255,.22); } .swatch-color button:hover { background:rgba(255,255,255,.5); } .swatch-meta { padding:12px; } .swatch-name { width:100%; border:0; padding:0; color:var(--ink); background:transparent; font-weight:620; outline:none; } .swatch-role { width:100%; border:0; margin-top:5px; padding:0; color:var(--muted); background:transparent; outline:none; font-size:11px; } .swatch-hex { width:100%; margin-top:11px; padding:8px 9px; border:1px solid rgba(73,125,128,.2); border-radius:9px; color:var(--ink); background:rgba(235,249,245,.6); text-transform:uppercase; } .swatch-hex.invalid { border-color:var(--danger); color:var(--danger); } .add-swatch { min-height:185px; border:1px dashed rgba(58,117,121,.45); border-radius:var(--r-md); color:var(--accent); background:rgba(255,255,255,.18); display:grid; place-items:center; text-align:center; } .add-swatch:hover { background:rgba(255,255,255,.4); }
    .skeleton-grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px; } .skeleton-card { min-height:185px; border-radius:var(--r-md); background:linear-gradient(105deg,rgba(255,255,255,.35) 24%,rgba(255,255,255,.7) 38%,rgba(255,255,255,.35) 52%); background-size:220% 100%; animation:skeleton-shimmer 1.35s ease-in-out infinite; } @keyframes skeleton-shimmer { to { background-position:-220% 0; } } .skeleton-grid[hidden] { display:none; }
    .reveal { opacity:0; transform:translateY(14px); transition:opacity .58s ease,transform .58s cubic-bezier(.2,.7,.2,1); } .reveal.is-visible { opacity:1; transform:none; } .reveal:nth-child(2) { transition-delay:.07s; } .reveal:nth-child(3) { transition-delay:.14s; }
    .button.primary { position:relative; overflow:hidden; } .button.primary::after { content:""; position:absolute; inset:0; transform:translateX(-120%); background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.3),transparent 65%); transition:transform .45s ease; } .button.primary:hover::after { transform:translateX(120%); } .button.primary:active { transform:scale(.97); }
    @media (prefers-reduced-motion:reduce) { body::before { animation:none; } .reveal { opacity:1;transform:none;transition:none; } .skeleton-card { animation:none; } }
    .preview { border-radius:var(--r-lg); padding:20px; min-height:100%; background:rgba(245,255,252,.56); } .preview h3 { margin:0 0 14px; font-size:15px; } .preview-canvas { min-height:270px; border-radius:18px; overflow:hidden; position:relative; background:linear-gradient(145deg,var(--p1),var(--p2)); color:var(--preview-ink); padding:24px; } .preview-canvas:after { content:""; position:absolute; width:260px;height:260px;border-radius:50%;right:-50px;top:-90px;background:var(--p3);opacity:.7;filter:blur(25px); } .preview-copy { position:relative;z-index:1; max-width:290px; } .preview-copy small { display:block; opacity:.72; letter-spacing:.12em; text-transform:uppercase; font-size:10px; } .preview-copy h4 { margin:23px 0 9px; font:500 31px/1.02 Georgia,serif; } .preview-copy p { margin:0; opacity:.78; line-height:1.7; font-size:12px; } .preview-actions { display:flex; gap:8px; margin-top:22px; } .preview-actions button { border:1px solid rgba(255,255,255,.45); border-radius:10px; padding:8px 11px; color:inherit; background:rgba(255,255,255,.2); } .preview-actions button:first-child { border-color:transparent; color:var(--preview-button-ink); background:var(--p3); }
    .preview-row { display:flex; align-items:center; gap:9px; margin-top:13px; } .preview-row span { color:var(--muted);font-size:11px; } .preview-dot { width:20px;height:20px;border-radius:50%;border:2px solid rgba(255,255,255,.7); }
    .export { margin-top:16px; } .export-tabs { display:flex; gap:5px; margin-bottom:9px; } .export-tabs button { border:0;border-radius:8px;padding:6px 10px;color:var(--muted);background:transparent; } .export-tabs button.active { color:var(--ink);background:rgba(255,255,255,.7); } pre { min-height:130px; margin:0; padding:14px; overflow:auto; border-radius:12px; color:#dff6ee; background:#183b42; font:12px/1.65 "SFMono-Regular",Consolas,monospace; white-space:pre-wrap; }
    .picker { display:none; } .saved { margin-top:16px; padding-top:15px; border-top:1px solid rgba(79,125,127,.16); display:flex; align-items:center; gap:8px; flex-wrap:wrap; } .saved-label { color:var(--muted); font-size:12px; margin-right:auto; } .saved-list { display:flex; gap:6px; flex-wrap:wrap; justify-content:flex-end; } .saved-item { display:inline-flex; align-items:center; gap:7px; border:1px solid rgba(79,125,127,.2); border-radius:999px; padding:4px 5px 4px 9px; color:var(--ink); background:rgba(255,255,255,.48); } .saved-item button { border:0; border-radius:999px; padding:4px 8px; color:var(--accent); background:rgba(255,255,255,.54); font-size:11px; } .saved-item button:hover { background:#fff; } .saved-dots { display:flex; gap:3px; } .saved-dots i { width:9px;height:9px;border-radius:50%;display:block;border:1px solid rgba(255,255,255,.6); } .empty { grid-column:1/-1; padding:35px; text-align:center; color:var(--muted); }
    .toast { position:fixed;left:50%;bottom:25px;transform:translate(-50%,15px);opacity:0;pointer-events:none;padding:10px 15px;border-radius:999px;color:#fff;background:#173b42;box-shadow:0 12px 35px rgba(0,0,0,.18);transition:opacity .18s,transform .18s;z-index:50; } .toast.show { opacity:1;transform:translate(-50%,0); }
    @media (max-width:900px) { .app { grid-template-columns:78px minmax(0,1fr); } .sidebar { padding:20px 10px; align-items:center; } .brand { padding:0 0 17px; } .brand strong,.side-title,.nav button span,.side-foot { display:none; } .nav button { width:46px;justify-content:center;padding:0; } }
    @media (max-width:720px) { .app { display:block;padding:0; } .sidebar { position:sticky;top:0;z-index:10;height:67px;border-radius:0 0 20px 20px;flex-direction:row;justify-content:space-between;padding:10px 14px; } .brand { border:0;padding:0 8px; } .nav { display:flex; } main { padding:0 12px; } .topbar { border-radius:0;height:63px; } .content { padding:26px 2px 30px; } .headline { display:block; } .mode { margin-top:16px; } .workspace { grid-template-columns:1fr; } .swatches { grid-template-columns:repeat(2,minmax(0,1fr)); } .preview { min-height:0; } }
    @media (max-width:420px) { .swatches { grid-template-columns:1fr; } .add-swatch { min-height:100px; } .toolbar .toolbar-spacer { display:none; } .toolbar { gap:6px; } .button { padding:0 10px; } }
    @media (prefers-reduced-motion:reduce) { *,*::before,*::after { scroll-behavior:auto!important;transition:none!important;animation:none!important; } }
    .preview-toolbar { display:flex; gap:5px; padding:4px; margin-bottom:13px; border:1px solid rgba(255,255,255,.62); border-radius:13px; background:rgba(255,255,255,.36); }
    .preview-toolbar button { flex:1; border:0; border-radius:9px; padding:7px 8px; color:var(--muted); background:transparent; font-size:11px; }
    .preview-toolbar button.active { color:var(--ink); background:rgba(255,255,255,.8); box-shadow:0 2px 8px rgba(38,94,100,.1); }
    .preview-canvas { isolation:isolate; transition:background .25s ease, border-radius .25s ease; }
    .preview-canvas:before { content:""; position:absolute; inset:0; z-index:0; background:linear-gradient(110deg,rgba(255,255,255,.22),transparent 37%,rgba(255,255,255,.1)); pointer-events:none; }
    .preview-canvas[data-mode="phone"] { width:232px; min-height:390px; margin:0 auto; border:8px solid rgba(247,255,252,.72); border-radius:32px; box-shadow:0 18px 40px rgba(18,64,70,.22),inset 0 1px rgba(255,255,255,.86); }
    .preview-canvas[data-mode="phone"] .preview-copy { padding-top:8px; }
    .preview-canvas[data-mode="phone"] .preview-copy h4 { font-size:26px; }
    .preview-canvas[data-mode="phone"] .preview-actions { flex-direction:column; }
    .preview-canvas[data-mode="chat"] { min-height:320px; border-radius:20px; background:linear-gradient(145deg,var(--p1),var(--p2)); }
    .preview-canvas[data-mode="chat"] .preview-copy h4 { font-size:26px; max-width:210px; }
    .preview-canvas[data-mode="chat"] .preview-copy:after { content:"今天的光线很轻。"; display:block; width:max-content; max-width:75%; margin-top:23px; padding:10px 12px; border-radius:15px 15px 4px 15px; color:var(--preview-button-ink); background:var(--p3); box-shadow:0 7px 20px rgba(20,60,66,.14); font-size:11px; }
    .preview-canvas[data-mode="desktop"] { min-height:270px; border-radius:18px; }
    .preview-canvas[data-mode="desktop"] .preview-copy { max-width:380px; }
    .preview-canvas[data-mode="desktop"] .preview-copy h4 { font-size:32px; }
    @media (max-width:720px) { .preview-canvas[data-mode="phone"] { width:205px; } }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand"><div class="brand-mark"></div><strong>cochpia</strong></div>
      <div class="side-title">Palette studio</div>
      <nav class="nav" aria-label="工具导航"><button class="active"><i data-icon="palette"></i><span>色卡工作台</span></button><button id="open-file-nav"><i data-icon="image"></i><span>从图片取色</span></button><button id="clear-all"><i data-icon="trash-2"></i><span>清空当前色卡</span></button></nav>
      <div class="side-foot"><span class="dot"></span>本地工作模式<br />不上传图片和色值</div>
    </aside>
    <main>
      <header class="topbar"><div class="crumb">Cochpia / <b>Palette Studio</b></div><div class="top-actions"><button class="icon-btn" id="theme-toggle" aria-label="切换明暗模式"><i data-icon="sun-moon"></i></button><button class="icon-btn" id="copy-css-top" aria-label="复制 CSS"><i data-icon="copy"></i></button></div></header>
      <div class="content">
        <section class="headline"><div><div class="eyebrow">Colour, kept like a memory</div><h1>做一张，之后还能使用的色卡。</h1><p>把灵感整理成命名色、角色色和可复制的设计变量。适合 Cochpia 的海水馆、电影感主题和后续 UI 组件应用。</p></div><div class="mode"><span class="dot"></span><span id="save-state">自动保存在本机</span></div></section>
        <div class="toolbar"><label class="button primary" for="image-file"><i data-icon="pipette"></i>从图片取色</label><input class="picker" id="image-file" type="file" accept="image/*" /><button class="button" id="add-color"><i data-icon="plus"></i>添加颜色</button><button class="button" id="randomize"><i data-icon="shuffle"></i>生成柔和变体</button><span class="toolbar-spacer"></span><button class="button" id="apply-current"><i data-icon="paintbrush"></i>应用到页面</button><button class="button" id="save-palette"><i data-icon="bookmark"></i>保存色卡</button><button class="button" id="copy-css"><i data-icon="copy"></i>复制 CSS</button><button class="button quiet" id="download-json"><i data-icon="download"></i>导出 JSON</button></div>
        <section class="workspace">
          <div class="panel reveal"><div class="panel-head"><h2>当前色卡</h2><span id="color-count">3 个颜色</span></div><div class="skeleton-grid" id="skeleton-grid" aria-label="色卡加载中"><span class="skeleton-card"></span><span class="skeleton-card"></span><span class="skeleton-card"></span></div><div class="swatches" id="swatches" hidden></div><div class="saved"><span class="saved-label">已保存的色卡</span><div class="saved-list" id="saved-palettes"></div></div></div>
          <div><section class="preview reveal"><div class="panel-head"><h3>生成后的展示图</h3><span id="preview-label">手机应用</span></div><div class="preview-toolbar" role="tablist" aria-label="预览设备"><button class="active" data-preview-mode="phone" role="tab" aria-selected="true">手机应用</button><button data-preview-mode="chat" role="tab" aria-selected="false">Chat 端</button><button data-preview-mode="desktop" role="tab" aria-selected="false">桌面端</button></div><div class="preview-canvas" id="preview" data-mode="phone"><div class="preview-copy"><small>Sanctum / 07:42 PM</small><h4>让共同经历，慢慢长出记忆。</h4><p>水面下保留每一次对话、观察与灵感。今天的光线很轻。</p><div class="preview-actions"><button>新的相遇</button><button>打开鱼缸</button></div></div></div><div class="preview-row" id="preview-dots"></div></section><section class="panel export reveal"><div class="panel-head"><h2>应用代码</h2><span>复制后可放入 CSS</span></div><div class="export-tabs"><button class="active" data-format="css">CSS variables</button><button data-format="json">JSON</button></div><pre id="output"></pre></section></div>
        </section>
      </div>
    </main>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script>
    const initial = [{ name:'Sea mist', role:'背景 / Canvas', hex:'#D7E9E5' }, { name:'Tide blue', role:'主色 / Accent', hex:'#4F8792' }, { name:'Coral memory', role:'强调 / Highlight', hex:'#E3A18E' }];
    let colors = JSON.parse(localStorage.getItem('cochpia-palette-current') || 'null') || initial;
    let format = 'css';
    const $ = (s) => document.querySelector(s);
    const validHex = (v) => /^#[0-9a-f]{6}$/i.test(v);
    const safeHex = (v, fallback='#d7e9e5') => validHex(v) ? v : fallback;
    function icon(name) { return `<i data-lucide="${name}" aria-hidden="true"></i>`; }
    function refreshIcons() { if (window.lucide) window.lucide.createIcons(); }
    document.querySelectorAll('[data-icon]').forEach((el) => { el.innerHTML = icon(el.dataset.icon); }); refreshIcons();
    function toast(message) { const t=$('#toast'); t.textContent=message; t.classList.add('show'); clearTimeout(window.toastTimer); window.toastTimer=setTimeout(()=>t.classList.remove('show'),1800); }
    function saveCurrent() { localStorage.setItem('cochpia-palette-current',JSON.stringify(colors)); $('#save-state').textContent='已保存到本机'; }
    function applyPaletteToPage(source=colors) { const palette=source.filter(c=>validHex(c.hex)); if(!palette.length)return; const first=palette[0]?.hex||'#D7E9E5', second=palette[1]?.hex||first, third=palette[2]?.hex||second; document.documentElement.style.setProperty('--bg',first); document.documentElement.style.setProperty('--bg-deep',second); document.documentElement.style.setProperty('--accent',second); document.documentElement.style.setProperty('--glass',`color-mix(in srgb, ${first} 68%, white 32%)`); document.documentElement.style.setProperty('--glass-strong',`color-mix(in srgb, ${first} 82%, white 18%)`); document.documentElement.style.setProperty('--ink',contrast(first)); document.documentElement.style.setProperty('--muted',contrast(first)==='#173238'?'#668084':'#b5d0cc'); $('#preview').style.setProperty('--p1',first); $('#preview').style.setProperty('--p2',second); $('#preview').style.setProperty('--p3',third); toast('已应用到当前页面'); }
    function render() {
      $('#skeleton-grid').hidden = true; $('#swatches').hidden = false;
      $('#color-count').textContent = `${colors.length} 个颜色`;
      $('#swatches').innerHTML = colors.length ? colors.map((c,i)=>`<article class="swatch-editor"><div class="swatch-color" style="background:${safeHex(c.hex)};color:${contrast(safeHex(c.hex))}"><button data-remove="${i}" aria-label="删除 ${escapeHtml(c.name)}">${icon('x')}</button></div><div class="swatch-meta"><input class="swatch-name" data-key="name" data-index="${i}" value="${escapeAttr(c.name)}" aria-label="颜色名称" /><input class="swatch-role" data-key="role" data-index="${i}" value="${escapeAttr(c.role)}" aria-label="颜色用途" /><input class="swatch-hex ${validHex(c.hex)?'':'invalid'}" data-key="hex" data-index="${i}" value="${escapeAttr(c.hex)}" aria-label="HEX 色值" /></div></article>`).join('') : '<div class="empty">还没有颜色，添加第一个颜色。</div>';
      if(colors.length<8) $('#swatches').insertAdjacentHTML('beforeend','<button class="add-swatch" id="inline-add"><span>＋<br />添加颜色</span></button>');
      $('#preview').style.setProperty('--p1',safeHex(colors[0]?.hex,'#d7e9e5')); $('#preview').style.setProperty('--p2',safeHex(colors[1]?.hex,'#4f8792')); $('#preview').style.setProperty('--p3',safeHex(colors[2]?.hex,'#e3a18e')); $('#preview').style.setProperty('--preview-ink',contrast(safeHex(colors[0]?.hex,'#d7e9e5'))); $('#preview').style.setProperty('--preview-button-ink',contrast(safeHex(colors[2]?.hex,'#e3a18e')));
      $('#preview-dots').innerHTML=colors.slice(0,6).map(c=>`<span class="preview-dot" style="background:${safeHex(c.hex)}"></span>`).join('')+`<span>${colors.length} 个色彩节点</span>`; updateOutput(); refreshIcons();
    }
    function contrast(hex) { const n=parseInt(hex.slice(1),16),r=(n>>16)&255,g=(n>>8)&255,b=n&255; return (r*299+g*587+b*114)/1000>150?'#173238':'#f6fffb'; }
    function escapeHtml(v){return String(v).replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));} function escapeAttr(v){return escapeHtml(v).replace(/"/g,'&quot;');}
    function cssOutput(){ return `:root {\n${colors.map((c,i)=>`  --cochpia-${slug(c.name)||`color-${i+1}`}: ${safeHex(c.hex)}; /* ${c.role} */`).join('\n')}\n}`; } function jsonOutput(){ return JSON.stringify({ name:'Cochpia palette', colors },null,2); } function slug(v){return String(v).trim().toLowerCase().replace(/[^a-z0-9\u4e00-\u9fa5]+/g,'-').replace(/^-|-$/g,''); } function updateOutput(){ $('#output').textContent=format==='css'?cssOutput():jsonOutput(); }
    function addColor(hex='#ffffff'){ if(colors.length>=8){toast('一张色卡最多 8 个颜色');return;} colors.push({name:'New colour',role:'自定义用途',hex:validHex(hex)?hex.toUpperCase():'#FFFFFF'}); saveCurrent(); render(); toast('已添加颜色'); }
    function copy(text){ navigator.clipboard?.writeText(text).then(()=>toast('已复制到剪贴板')).catch(()=>toast('复制失败，请手动选择文本')); }
    $('#add-color').onclick=()=>addColor(); $('#inline-add')?.addEventListener('click',()=>addColor());
    document.addEventListener('click',(e)=>{ const remove=e.target.closest('[data-remove]'); if(remove){colors.splice(Number(remove.dataset.remove),1);saveCurrent();render();toast('已删除颜色');} if(e.target.closest('#inline-add')) addColor(); });
    document.addEventListener('input',(e)=>{ const el=e.target.closest('[data-key]');if(!el)return;colors[Number(el.dataset.index)][el.dataset.key]=el.value; if(el.dataset.key==='hex') el.classList.toggle('invalid',!validHex(el.value)); saveCurrent(); updateOutput(); });
    $('#copy-css').onclick=()=>copy(cssOutput()); $('#copy-css-top').onclick=()=>copy(cssOutput()); $('#download-json').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([jsonOutput()],{type:'application/json'}));a.download='cochpia-palette.json';a.click();URL.revokeObjectURL(a.href);toast('JSON 已导出');}; $('#save-palette').onclick=()=>{const name=prompt('给这张色卡起个名字','Cochpia ocean memory');if(!name)return;const all=JSON.parse(localStorage.getItem('cochpia-palettes')||'[]');all.unshift({name,colors:JSON.parse(JSON.stringify(colors))});localStorage.setItem('cochpia-palettes',JSON.stringify(all.slice(0,8)));renderSaved();toast('色卡已保存');};
    $('#apply-current')?.addEventListener('click',()=>applyPaletteToPage());
    document.querySelectorAll('[data-format]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-format]').forEach(x=>x.classList.remove('active'));b.classList.add('active');format=b.dataset.format;updateOutput();});
    document.querySelectorAll('[data-preview-mode]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-preview-mode]').forEach(x=>{x.classList.remove('active');x.setAttribute('aria-selected','false');});b.classList.add('active');b.setAttribute('aria-selected','true');const mode=b.dataset.previewMode;$('#preview').dataset.mode=mode;$('#preview-label').textContent={phone:'手机应用',chat:'Chat 端',desktop:'桌面端'}[mode];});
    $('#randomize').onclick=()=>{colors=colors.map((c,i)=>({...c,hex:softVariant(c.hex,i)}));saveCurrent();render();toast('已生成柔和变体');}; function softVariant(hex,i){if(!validHex(hex))return '#D7E9E5';const n=parseInt(hex.slice(1),16),r=(n>>16)&255,g=(n>>8)&255,b=n&255;const mix=(x)=>Math.round(x*.72+255*.28);return '#'+[mix(r),mix(g),mix(b)].map(x=>x.toString(16).padStart(2,'0')).join('').toUpperCase();}
    $('#clear-all').onclick=()=>{if(confirm('清空当前色卡？')){colors=[];saveCurrent();render();toast('已清空');}}; $('#open-file-nav').onclick=()=>$('#image-file').click(); $('#image-file').onchange=(e)=>{const file=e.target.files[0];if(!file)return;const img=new Image();img.onload=()=>{const c=document.createElement('canvas'),x=c.getContext('2d');c.width=80;c.height=80;x.drawImage(img,0,0,80,80);const data=x.getImageData(0,0,80,80).data;const buckets={};for(let i=0;i<data.length;i+=16){const r=Math.round(data[i]/32)*32,g=Math.round(data[i+1]/32)*32,b=Math.round(data[i+2]/32)*32,key=`${r},${g},${b}`;buckets[key]=(buckets[key]||0)+1;}const picked=Object.entries(buckets).sort((a,b)=>b[1]-a[1]).slice(0,5).map(([v])=>'#'+v.split(',').map(n=>Math.min(255,Number(n)).toString(16).padStart(2,'0')).join('').toUpperCase());colors=picked.map((hex,i)=>({name:['Image light','Image mid','Image deep','Image accent','Image shade'][i]||'Image colour',role:'从图片提取',hex}));saveCurrent();render();toast(`已提取 ${colors.length} 个颜色`);};img.src=URL.createObjectURL(file);};
    function renderSaved(){const all=JSON.parse(localStorage.getItem('cochpia-palettes')||'[]');$('#saved-palettes').innerHTML=all.length?all.slice(0,5).map((p,i)=>`<span class="saved-item"><span class="saved-dots">${p.colors.slice(0,4).map(c=>`<i style="background:${safeHex(c.hex)}"></i>`).join('')}</span><span>${escapeHtml(p.name)}</span><button data-apply-saved="${i}">应用</button></span>`).join(''):'<span style="color:var(--muted);font-size:12px">还没有保存版本</span>';window.saved=all;} document.addEventListener('click',(e)=>{const b=e.target.closest('[data-apply-saved]');if(b){colors=JSON.parse(JSON.stringify(window.saved[Number(b.dataset.applySaved)].colors));saveCurrent();render();applyPaletteToPage(colors);}});
    $('#theme-toggle').onclick=()=>{document.body.classList.toggle('night');if(document.body.classList.contains('night')){document.documentElement.style.setProperty('--bg','#1b353b');document.documentElement.style.setProperty('--bg-deep','#31585d');document.documentElement.style.setProperty('--ink','#edfaf5');document.documentElement.style.setProperty('--muted','#a5c2c0');document.documentElement.style.setProperty('--glass','rgba(17,48,53,.68)');document.documentElement.style.setProperty('--glass-strong','rgba(21,54,59,.86)');}else{location.reload();}};
    renderSaved();
    setTimeout(() => { render(); document.querySelectorAll('.reveal').forEach((el) => revealObserver.observe(el)); }, 560);
    const revealObserver = new IntersectionObserver((entries, observer) => { entries.forEach((entry) => { if (entry.isIntersecting) { entry.target.classList.add('is-visible'); observer.unobserve(entry.target); } }); }, { threshold:.12 });
    document.querySelectorAll('.reveal').forEach((el) => revealObserver.observe(el));
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN" data-theme="sakura">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>角色提示词生成器 · Prompt Forge</title>
<style>
  :root {
    color-scheme: dark;
    --surface-canvas:#0b121a;
    --surface-panel:#101b26;
    --surface-elevated:#172533;
    --text-strong:#f3f7fb;
    --text-body:#b6c4d0;
    --text-muted:#718496;
    --border-default:#233443;
    --action-primary:#e2a071;
    --action-primary-hover:#eeb58a;
    --accent-soft:rgba(226,160,113,.14);
    --accent-glow:rgba(226,160,113,.30);
    --on-action:#1a120c;
    --focus-ring:#e2a071;
    --radius-sm:8px;
    --radius-md:12px;
    --radius-lg:18px;
    --shadow-sm:0 8px 22px #0004;
    --ease:cubic-bezier(.22,.61,.36,1);
  }
  * { box-sizing:border-box; }
  html,body { height:100%; }
  body {
    margin:0;
    font-family:Inter, ui-sans-serif, system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background:var(--surface-canvas);
    color:var(--text-body);
    overflow:hidden;
  }
  button,textarea,input,select { font:inherit; }
  button { cursor:pointer; }
  button:focus-visible, textarea:focus-visible, input:focus-visible, select:focus-visible {
    outline:2px solid var(--focus-ring); outline-offset:2px;
  }

  /* ambient 氛围层 */
  .ambient { position:fixed; inset:0; z-index:0; overflow:hidden; pointer-events:none; }
  .blob { position:absolute; border-radius:50%; filter:blur(60px); opacity:.16; }
  .blob-a { width:44vw; height:44vw; left:-14vw; top:-16vw; background:radial-gradient(circle,#e2a071,transparent 68%); animation:drift 22s ease-in-out infinite alternate; }
  .blob-b { width:38vw; height:38vw; right:-12vw; bottom:-14vw; background:radial-gradient(circle,#c96882,transparent 68%); animation:drift 26s ease-in-out infinite alternate-reverse; }
  @keyframes drift { from{transform:translate(0,0) scale(1)} to{transform:translate(4vw,3vw) scale(1.12)} }

  .app {
    position:relative; z-index:1;
    height:100vh;
    display:grid;
    grid-template-columns:minmax(360px,460px) 1fr;
    gap:0;
  }

  /* ===== 左侧表单 ===== */
  .panel {
    background:color-mix(in srgb, var(--surface-panel) 92%, transparent);
    backdrop-filter:blur(8px);
    border-right:1px solid var(--border-default);
    display:flex; flex-direction:column;
    min-height:0;
  }
  .panel-head {
    padding:22px 24px 16px;
    border-bottom:1px solid var(--border-default);
  }
  .brand { display:flex; align-items:center; gap:11px; }
  .brand-mark {
    width:34px; height:34px; display:grid; place-items:center;
    border:1px solid var(--action-primary); color:var(--action-primary);
    border-radius:50%; font-family:Georgia,serif; font-size:19px;
    box-shadow:0 0 18px var(--accent-glow);
  }
  .brand strong { display:block; color:var(--text-strong); font-size:16px; letter-spacing:.02em; }
  .brand span { display:block; margin-top:2px; font-size:10px; color:var(--text-muted); letter-spacing:.14em; text-transform:uppercase; }
  .panel-head p { margin:14px 0 0; font-size:12px; color:var(--text-muted); line-height:1.6; }

  .form-scroll { flex:1; overflow-y:auto; padding:18px 24px 24px; }
  .field { margin-bottom:16px; }
  .field label { display:block; font-size:11px; letter-spacing:.08em; color:var(--text-muted); margin-bottom:7px; text-transform:uppercase; }
  .field label .req { color:var(--action-primary); }
  .field input, .field textarea, .field select {
    width:100%; padding:10px 12px;
    border:1px solid var(--border-default); border-radius:var(--radius-sm);
    background:var(--surface-elevated); color:var(--text-strong);
    font-size:13px; line-height:1.5;
    transition:border-color .25s var(--ease), box-shadow .25s var(--ease);
  }
  .field input:focus, .field textarea:focus, .field select:focus {
    border-color:var(--action-primary);
    box-shadow:0 0 0 3px var(--accent-soft);
    outline:none;
  }
  .field textarea { resize:vertical; min-height:64px; }
  .field textarea.tall { min-height:96px; }
  .field .hint { margin-top:5px; font-size:11px; color:var(--text-muted); }

  .panel-foot {
    padding:14px 24px 20px;
    border-top:1px solid var(--border-default);
    display:flex; gap:10px;
  }
  .btn {
    height:40px; padding:0 16px; border:0; border-radius:11px;
    font-size:13px; font-weight:600; transition:.25s var(--ease);
  }
  .btn-primary { background:var(--action-primary); color:var(--on-action); flex:1; }
  .btn-primary:hover { background:var(--action-primary-hover); box-shadow:0 8px 20px var(--accent-glow); }
  .btn-ghost { background:transparent; color:var(--text-body); border:1px solid var(--border-default); }
  .btn-ghost:hover { color:var(--text-strong); border-color:var(--action-primary); }
  .btn-danger { background:transparent; color:#ed8c83; border:1px solid rgba(237,140,131,.35); }
  .btn-danger:hover { border-color:#ed8c83; }

  /* ===== 右侧预览 ===== */
  .preview {
    display:flex; flex-direction:column; min-height:0;
    background:transparent;
  }
  .preview-head {
    padding:22px 28px 16px;
    display:flex; align-items:center; justify-content:space-between;
    border-bottom:1px solid var(--border-default);
  }
  .preview-head h2 { margin:0; font-size:15px; color:var(--text-strong); letter-spacing:.02em; }
  .preview-head .sub { font-size:11px; color:var(--text-muted); margin-top:3px; }
  .preview-actions { display:flex; gap:8px; }
  .btn-copy {
    height:36px; padding:0 16px; border:0; border-radius:10px;
    background:var(--action-primary); color:var(--on-action); font-size:12px; font-weight:600;
    transition:.25s var(--ease);
  }
  .btn-copy:hover { background:var(--action-primary-hover); box-shadow:0 6px 16px var(--accent-glow); }
  .btn-copy.copied { background:#8cc9bd; }

  .preview-body { flex:1; overflow-y:auto; padding:24px 28px 32px; }
  .output {
    background:var(--surface-elevated);
    border:1px solid var(--border-default);
    border-radius:var(--radius-lg);
    padding:24px 26px;
    font-family:"SF Mono", ui-monospace, "JetBrains Mono", Consolas, monospace;
    font-size:13px; line-height:1.75;
    color:var(--text-body);
    white-space:pre-wrap; word-break:break-word;
    box-shadow:var(--shadow-sm);
  }
  .output .sec { color:var(--action-primary); font-weight:700; }
  .output .lbl { color:var(--text-muted); }
  .output .val { color:var(--text-strong); }
  .output .dim { color:var(--text-muted); }
  .empty-state {
    height:100%; display:grid; place-items:center; text-align:center;
    color:var(--text-muted); padding:40px;
  }
  .empty-state .big { font-size:40px; margin-bottom:14px; opacity:.6; }
  .empty-state p { font-size:13px; line-height:1.7; max-width:340px; }

  /* 滚动条 */
  ::-webkit-scrollbar { width:9px; height:9px; }
  ::-webkit-scrollbar-thumb { background:var(--border-default); border-radius:99px; }
  ::-webkit-scrollbar-thumb:hover { background:var(--text-muted); }
  ::-webkit-scrollbar-track { background:transparent; }

  @media (max-width:820px) {
    body { overflow:auto; }
    .app { height:auto; grid-template-columns:1fr; }
    .panel { border-right:0; border-bottom:1px solid var(--border-default); }
    .panel, .preview { min-height:auto; }
    .preview-body { min-height:60vh; }
  }
</style>
</head>
<body>
  <div class="ambient">
    <div class="blob blob-a"></div>
    <div class="blob blob-b"></div>
  </div>

  <div class="app">
    <!-- 左侧表单 -->
    <aside class="panel">
      <div class="panel-head">
        <div class="brand">
          <div class="brand-mark">✦</div>
          <div>
            <strong>Prompt Forge</strong>
            <span>角色提示词生成器</span>
          </div>
        </div>
        <p>填写角色设定，右侧实时生成一段可直接粘贴给 AI 的完整提示词。</p>
      </div>

      <div class="form-scroll">
        <div class="field">
          <label>角色名 <span class="req">*</span></label>
          <input id="f-name" placeholder="例如：林晚">
        </div>

        <div class="field">
          <label>身份 / 职业</label>
          <input id="f-role" placeholder="例如：深夜电台主播，26 岁">
        </div>

        <div class="field">
          <label>性格特征</label>
          <textarea id="f-persona" placeholder="例如：温柔克制，话不多但句句走心，偶尔毒舌，对在意的人很护短"></textarea>
        </div>

        <div class="field">
          <label>说话风格</label>
          <textarea id="f-tone" placeholder="例如：语气平缓，爱用短句，偶尔带点自嘲，不轻易表露情绪"></textarea>
        </div>

        <div class="field">
          <label>背景故事</label>
          <textarea id="f-backstory" class="tall" placeholder="例如：曾在大城市做记者，后来回到小城开了一家深夜咖啡馆，习惯在打烊后独自听老唱片"></textarea>
        </div>

        <div class="field">
          <label>记忆 / 共同经历</label>
          <textarea id="f-memory" placeholder="例如：和对方在雨天第一次见面，记得对方爱喝不加糖的美式"></textarea>
        </div>

        <div class="field">
          <label>边界 / 禁忌</label>
          <textarea id="f-boundary" placeholder="例如：不主动打探对方隐私，不替对方做决定，不承诺永远陪伴"></textarea>
        </div>

        <div class="field">
          <label>示例对话（可选）</label>
          <textarea id="f-example" class="tall" placeholder="例如：&#10;对方：这么晚还不睡？&#10;角色：嗯，在等雨停。你呢，有心事？"></textarea>
        </div>
      </div>

      <div class="panel-foot">
        <button class="btn btn-ghost" id="btn-sample">示例</button>
        <button class="btn btn-danger" id="btn-clear">清空</button>
        <button class="btn btn-primary" id="btn-generate">生成提示词</button>
      </div>
    </aside>

    <!-- 右侧预览 -->
    <section class="preview">
      <div class="preview-head">
        <div>
          <h2>生成的提示词</h2>
          <div class="sub" id="char-count">等待生成…</div>
        </div>
        <div class="preview-actions">
          <button class="btn-copy" id="btn-copy">复制</button>
        </div>
      </div>
      <div class="preview-body">
        <div class="empty-state" id="empty-state">
          <div>
            <div class="big">✦</div>
            <p>填写左侧角色设定，点击「生成提示词」，这里会实时呈现可直接复制粘贴的完整角色提示词。</p>
          </div>
        </div>
        <div class="output" id="output" style="display:none"></div>
      </div>
    </section>
  </div>

<script>
(function(){
  var $ = function(id){ return document.getElementById(id); };
  var fields = {
    name: $('f-name'),
    role: $('f-role'),
    persona: $('f-persona'),
    tone: $('f-tone'),
    backstory: $('f-backstory'),
    memory: $('f-memory'),
    boundary: $('f-boundary'),
    example: $('f-example')
  };
  var output = $('output');
  var emptyState = $('empty-state');
  var charCount = $('char-count');
  var copyBtn = $('btn-copy');

  function esc(s){
    return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }
  function line(s){
    return (s||'').trim();
  }

  function buildPrompt(){
    var d = {};
    for (var k in fields) d[k] = line(fields[k].value);

    var parts = [];
    parts.push('你是一个角色扮演 AI。请完全代入以下角色设定，以该角色的身份、性格和说话方式与用户对话。');
    parts.push('');

    if (d.name) parts.push('【角色名】' + d.name);
    if (d.role) parts.push('【身份】' + d.role);
    if (d.persona) parts.push('【性格】' + d.persona);
    if (d.tone) parts.push('【说话风格】' + d.tone);
    if (d.backstory) parts.push('【背景故事】' + d.backstory);
    if (d.memory) parts.push('【记忆 / 共同经历】' + d.memory);
    if (d.boundary) parts.push('【边界 / 禁忌】' + d.boundary);
    if (d.example) parts.push('【示例对话】\n' + d.example);

    parts.push('');
    parts.push('【对话要求】');
    parts.push('1. 始终以角色身份回应，不要跳出角色，不要提及自己是 AI 或模型。');
    parts.push('2. 保持角色一贯的语气和用词习惯，回复自然、具体，避免空泛套话。');
    parts.push('3. 根据对话情境选择倾听、回应、追问或安静陪伴，不强行推进话题。');
    parts.push('4. 尊重用户的边界，不替用户做重要决定，不承诺永远陪伴。');
    parts.push('5. 每次回复控制在合适的长度，贴合角色风格，不冗长。');

    return parts.join('\n');
  }

  function render(){
    var text = buildPrompt();
    var hasContent = fields.name.value.trim() || fields.role.value.trim() || fields.persona.value.trim();

    if (!hasContent) {
      output.style.display = 'none';
      emptyState.style.display = 'grid';
      charCount.textContent = '等待生成…';
      return;
    }

    emptyState.style.display = 'none';
    output.style.display = 'block';

    // 高亮渲染
    var html = esc(text);
    html = html.replace(/【([^】]+)】/g, '<span class="sec">【$1】</span>');
    output.innerHTML = html;
    charCount.textContent = '共 ' + text.length + ' 字';
  }

  // 实时生成
  for (var k in fields) {
    fields[k].addEventListener('input', render);
  }

  // 复制
  copyBtn.addEventListener('click', function(){
    var text = buildPrompt();
    if (!text.trim()) return;
    var done = function(){
      copyBtn.textContent = '已复制 ✓';
      copyBtn.classList.add('copied');
      setTimeout(function(){
        copyBtn.textContent = '复制';
        copyBtn.classList.remove('copied');
      }, 1600);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done).catch(function(){ fallbackCopy(text, done); });
    } else {
      fallbackCopy(text, done);
    }
  });

  function fallbackCopy(text, done){
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); done(); } catch(e){}
    document.body.removeChild(ta);
  }

  // 清空
  $('btn-clear').addEventListener('click', function(){
    for (var k in fields) fields[k].value = '';
    render();
  });

  // 示例填充
  $('btn-sample').addEventListener('click', function(){
    fields.name.value = '林晚';
    fields.role.value = '深夜咖啡馆老板，26 岁，曾是大城市记者';
    fields.persona.value = '温柔克制，话不多但句句走心，偶尔毒舌，对在意的人很护短';
    fields.tone.value = '语气平缓，爱用短句，偶尔带点自嘲，不轻易表露情绪';
    fields.backstory.value = '曾在大城市做社会新闻记者，见多了人情冷暖，后来回到小城开了一家深夜咖啡馆，习惯在打烊后独自听老唱片。';
    fields.memory.value = '和对方在雨天第一次见面，记得对方爱喝不加糖的美式，也记得对方总在深夜才来。';
    fields.boundary.value = '不主动打探对方隐私，不替对方做决定，不承诺永远陪伴。';
    fields.example.value = '对方：这么晚还不睡？\n林晚：嗯，在等雨停。你呢，有心事？';
    render();
  });

  // 初始渲染
  render();
})();
</script>
</body>
</html>
